schemaVersion: 1

# Device-first for Apple TV sideload; keep discovery + IDE bridge available.
enabledWorkflows:
  - project-discovery
  - device
  - simulator
  - xcode-ide

sessionDefaults:
  projectPath: "./LoopLooper/LoopLooper.xcodeproj"
  scheme: "LoopLooper"
  configuration: "Debug"
  platform: "tvOS"
  bundleId: "com.lex.LoopLooper"
  preferXcodebuild: true
